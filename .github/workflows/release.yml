name: release binaries

# Build release binaries for the major platforms and attach them to a
# GitHub Release, so users can grab a ready-made `envorigin` without
# cargo-installing or tapping Homebrew. Runs when a release is published
# (the `release.sh` flow) and can be re-run manually to (re-)upload
# binaries for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build binaries for (e.g. v1.12.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker (linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Ensure target std installed
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          mv envorigin${{ matrix.ext }} "envorigin-${TAG}-${{ matrix.target }}${{ matrix.ext }}"
          gh release upload "$TAG" "envorigin-${TAG}-${{ matrix.target }}${{ matrix.ext }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
        shell: bash
