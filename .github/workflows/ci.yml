name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Audit own workflow (dogfood)
        run: cargo run --quiet -- actions audit --file .github/workflows/ci.yml --fail-on warning

  action:
    name: envorigin-action (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exercise the published wrapper action against this repository:
      # it downloads the prebuilt binary and audits every workflow file.
      - uses: FIERsity/envorigin-action@v1
