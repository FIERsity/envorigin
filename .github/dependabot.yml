version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      serde:
        patterns: ["serde", "serde-*"]
      clap:
        patterns: ["clap", "clap-*"]
      tower:
        patterns: ["tower-lsp", "tokio", "async-trait"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
